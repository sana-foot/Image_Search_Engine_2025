<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <title>Login - Image Search Engine</title>
</head>
<body>
    <div class="site-wrapper d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="container bg-dark text-white p-4 shadow rounded" style="opacity: 0.85; max-width: 400px;">
            <h2 class="text-center mb-4">Connexion</h2>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div>
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="button" class="btn btn-primary btn-block" onclick="login()">Se connecter</button>
            </div>
        </div>
    </div>
    <script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
        }).then(r => { if(r.redirected) window.location.href = r.url; else r.text().then(t => { document.open(); document.write(t); document.close(); }); });
    }
    </script>
</body>
</html>
