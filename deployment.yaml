apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-engine-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web-container
        image: image_search_engine_2025-web:latest # <-- Utilise bien le nom de l'image de ton projet !
        imagePullPolicy: Never # Très important avec Minikube pour utiliser l'image Docker locale
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 5000
      targetPort: 5000
