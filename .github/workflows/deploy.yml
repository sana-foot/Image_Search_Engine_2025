name: Deploiement Automatique sur Proxmox

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion SSH et Deploiement
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Ces commandes seront tapées automatiquement sur ta VM !
          script: |
            cd ~/Image_Search_Engine_2025
            git pull origin main
            docker compose down
            docker compose up -d --build
